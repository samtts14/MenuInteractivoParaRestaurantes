# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools
name: Deploy Flutter Web to Firebase Hosting

on:
  push:
    branches:
      - Pantalla-Delivery  # <- tu rama de desarrollo

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clonar el repo
      - uses: actions/checkout@v4

      # 2️⃣ Configurar Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.0'  # ajusta a la versión que uses

      # 3️⃣ Instalar dependencias
      - name: Install dependencies
        run: flutter pub get

      # 4️⃣ Compilar Flutter Web
      - name: Build Web
        run: flutter build web --release

      # 5️⃣ Desplegar a Firebase Hosting
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MENUPARARESTAURANTES_STS}}
          channelId: live
          projectId: menupararestaurantes-sts
